<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">How the feed dial reaches hardship</title>
  <desc id="d">Normalizing versus engagement feed at lambda 0.5: opinion spread, out-group trust, minority starvation and stability, averaged over the last 50 days of a seed-7 run.</desc>
