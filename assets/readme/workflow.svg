  <rect x="942" y="104" width="200" height="64" rx="12" fill="#1A1F27" stroke="#2C333D" stroke-width="2"/>
  <text x="1042.0" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#F2EEE6">Stability</text>
  <path d="M924 136 h12 m-5 -6 l6 6 l-6 6" fill="none" stroke="#9AA3AE" stroke-width="2"/>
